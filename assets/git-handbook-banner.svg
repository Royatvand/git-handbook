<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
  <title id="title">Git Handbook — راهنمای Git</title>
  <desc id="desc">A compact bilingual Git learning banner with a terminal, branching graph, Git emblem, and handbook illustration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset=".58" stop-color="#101b38"/>
      <stop offset="1" stop-color="#080f20"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7654"/>
      <stop offset="1" stop-color="#ef3d32"/>
    </linearGradient>
    <linearGradient id="book" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4275"/>
      <stop offset="1" stop-color="#09162d"/>
    </linearGradient>
    <radialGradient id="blueGlow">
      <stop offset="0" stop-color="#1775dd" stop-opacity=".34"/>
      <stop offset="1" stop-color="#1775dd" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000814" flood-opacity=".55"/>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#7697c9" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1000" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1000" height="340" rx="22" fill="url(#grid)"/>
  <ellipse cx="785" cy="206" rx="205" ry="142" fill="url(#blueGlow)"/>
  <path d="M24 66V288" stroke="#287dff" stroke-width="4" stroke-linecap="round"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="48" y="39" fill="#8fa9cc" font-size="11" font-weight="700" letter-spacing="2.4">OPEN SOURCE LEARNING RESOURCE</text>
    <text x="48" y="96" fill="#f4f7ff" font-size="47" font-weight="800">Git <tspan fill="#ff5d45">Handbook</tspan></text>
    <text x="50" y="127" fill="#c8d7ef" font-size="19" font-weight="600">From Zero to Advanced</text>
    <text x="50" y="157" fill="#9fb4d2" font-size="14">A practical guide for developers of all levels.</text>
    <path d="M50 176H510" stroke="#4c6691" stroke-opacity=".5"/>
    <text x="510" y="207" text-anchor="end" direction="rtl" unicode-bidi="plaintext" fill="#f4f7ff" font-family="Tahoma,Arial,sans-serif" font-size="24" font-weight="700">راهنمای Git</text>
    <text x="510" y="235" text-anchor="end" direction="rtl" unicode-bidi="plaintext" fill="#ff785d" font-family="Tahoma,Arial,sans-serif" font-size="18" font-weight="700">از صفر تا حرفه‌ای</text>
    <text x="510" y="261" text-anchor="end" direction="rtl" unicode-bidi="plaintext" fill="#9fb4d2" font-family="Tahoma,Arial,sans-serif" font-size="13">آموزش کاربردی، مثال‌های عملی و گردش‌کارهای واقعی</text>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M600 133L642 171L675 171L708 205" stroke="#12c6b1" stroke-width="3"/>
    <path d="M594 210L632 210L662 239" stroke="#2188ff" stroke-width="3"/>
    <path d="M895 132L923 106L949 106" stroke="#a56bff" stroke-width="3"/>
    <circle cx="600" cy="133" r="5" fill="#12c6b1"/>
    <circle cx="642" cy="171" r="5" fill="#12c6b1"/>
    <circle cx="708" cy="205" r="5" fill="#12c6b1"/>
    <circle cx="594" cy="210" r="5" fill="#2188ff"/>
    <circle cx="662" cy="239" r="5" fill="#2188ff"/>
    <circle cx="949" cy="106" r="5" fill="#a56bff"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="655" y="61" width="284" height="139" rx="14" fill="#0b1427" stroke="#315783" stroke-width="1.5"/>
    <path d="M655 79Q655 61 673 61H921Q939 61 939 79V91H655Z" fill="#132744"/>
    <circle cx="674" cy="76" r="4.5" fill="#ff5c58"/>
    <circle cx="690" cy="76" r="4.5" fill="#ffc247"/>
    <circle cx="706" cy="76" r="4.5" fill="#25d6a2"/>
    <g font-family="Consolas,Menlo,monospace" font-size="12">
      <text x="674" y="116" fill="#6ee7f9">$ git status</text>
      <text x="674" y="139" fill="#8ea8ce">On branch <tspan fill="#76e5ad">main</tspan></text>
      <text x="674" y="161" fill="#76e5ad">+ README.md</text>
      <text x="674" y="182" fill="#76e5ad">+ src/main.js</text>
    </g>
  </g>
  <g transform="translate(823 149)" filter="url(#shadow)">
    <rect x="-43" y="-43" width="86" height="86" rx="14" fill="url(#orange)" transform="rotate(45)"/>
    <g fill="none" stroke="#101c36" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-11 -18L12 5V25"/>
      <path d="M-11 -18V10"/>
      <path d="M-11 10L12 5"/>
    </g>
    <g fill="#101c36"><circle cx="-11" cy="-18" r="6"/><circle cx="12" cy="5" r="6"/><circle cx="12" cy="25" r="6"/><circle cx="-11" cy="10" r="6"/></g>
  </g>
  <g transform="translate(807 258)" filter="url(#shadow)">
    <path d="M-137 -15Q-87 -36 -7 -12V33Q-83 13 -137 29Z" fill="url(#book)" stroke="#2c8bdc" stroke-width="1.5"/>
    <path d="M137 -15Q87 -36 7 -12V33Q83 13 137 29Z" fill="url(#book)" stroke="#a56bff" stroke-width="1.5"/>
    <path d="M0 -11V34" stroke="#c8d9f7" stroke-opacity=".8" stroke-width="2"/>
    <g fill="none" stroke="#16c6df" stroke-width="3" stroke-linecap="round">
      <path d="M-112 -4L-48 3"/><path d="M-112 8L-52 15"/>
    </g>
    <g fill="none" stroke="#b7c9ef" stroke-width="2.5" stroke-linecap="round">
      <path d="M49 -3L72 8V17"/><path d="M49 -3V15"/>
      <circle cx="49" cy="-3" r="3" fill="#b7c9ef"/><circle cx="72" cy="8" r="3" fill="#b7c9ef"/><circle cx="72" cy="17" r="3" fill="#b7c9ef"/>
    </g>
  </g>
  <path d="M48 302H952" stroke="#47618c" stroke-opacity=".55"/>
  <text x="500" y="324" text-anchor="middle" fill="#90a8ca" font-family="Inter,Arial,sans-serif" font-size="11" letter-spacing="2">LEARN GIT  •  BUILD BETTER  •  GROW TOGETHER</text>
</svg>