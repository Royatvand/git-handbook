<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Git Handbook — راهنمای Git</title>
  <desc id="desc">A bilingual Persian and English Git learning banner with a branching graph and an open book.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06152c"/>
      <stop offset=".55" stop-color="#111b3d"/>
      <stop offset="1" stop-color="#071126"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6849"/>
      <stop offset="1" stop-color="#f04438"/>
    </linearGradient>
    <linearGradient id="book" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#183a68"/>
      <stop offset="1" stop-color="#0b1733"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#167bd8" stop-opacity=".42"/>
      <stop offset="1" stop-color="#167bd8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <ellipse cx="600" cy="286" rx="235" ry="120" fill="url(#glow)"/>
  <ellipse cx="600" cy="320" rx="175" ry="25" fill="#050b1b" opacity=".6" filter="url(#soft)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".95">
    <path d="M405 225 L350 180 L302 180 L266 144" stroke="#08c7b5" stroke-width="3"/>
    <path d="M407 247 L338 247 L302 276 L256 276" stroke="#1688ff" stroke-width="3"/>
    <path d="M795 226 L850 175 L899 175 L937 137" stroke="#ff674d" stroke-width="3"/>
    <path d="M794 248 L862 248 L902 280 L945 280" stroke="#a855f7" stroke-width="3"/>
    <path d="M448 206 L420 169 L389 169" stroke="#1f8bff" stroke-width="2"/>
    <path d="M754 204 L782 164 L810 164" stroke="#a855f7" stroke-width="2"/>
  </g>
  <g>
    <circle cx="266" cy="144" r="6" fill="#08c7b5"/><circle cx="350" cy="180" r="6" fill="#08c7b5"/>
    <circle cx="256" cy="276" r="6" fill="#1688ff"/><circle cx="302" cy="276" r="6" fill="#1688ff"/>
    <circle cx="937" cy="137" r="6" fill="#ff674d"/><circle cx="850" cy="175" r="6" fill="#ff674d"/>
    <circle cx="945" cy="280" r="6" fill="#a855f7"/><circle cx="902" cy="280" r="6" fill="#a855f7"/>
    <circle cx="389" cy="169" r="5" fill="#1f8bff"/><circle cx="810" cy="164" r="5" fill="#a855f7"/>
  </g>
  <g transform="translate(600 117)">
    <rect x="-49" y="-49" width="98" height="98" rx="17" fill="url(#accent)" transform="rotate(45)"/>
    <g fill="none" stroke="#111b38" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-15 -22 L14 7 L14 29"/>
      <path d="M-15 -22 L-15 12"/>
      <path d="M-15 12 L14 7"/>
    </g>
    <g fill="#111b38"><circle cx="-15" cy="-22" r="7"/><circle cx="14" cy="7" r="7"/><circle cx="14" cy="29" r="7"/><circle cx="-15" cy="12" r="7"/></g>
  </g>
  <g transform="translate(600 285)">
    <path d="M-137 -1 Q-86 -27 -10 1 L-10 70 Q-79 42 -137 62 Z" fill="url(#book)" stroke="#2587d9" stroke-width="2"/>
    <path d="M137 -1 Q86 -27 10 1 L10 70 Q79 42 137 62 Z" fill="url(#book)" stroke="#a855f7" stroke-width="2"/>
    <path d="M0 2 L0 71" stroke="#d9e8ff" stroke-opacity=".8" stroke-width="3"/>
    <g fill="none" stroke="#14b8d4" stroke-width="4" stroke-linecap="round">
      <path d="M-112 14 L-44 24"/><path d="M-112 29 L-39 39"/><path d="M-112 44 L-52 53"/>
    </g>
    <g fill="none" stroke="#b9ccf3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M53 18 L80 37 L80 49"/><path d="M53 18 L53 40"/>
      <circle cx="53" cy="18" r="4" fill="#b9ccf3"/><circle cx="80" cy="37" r="4" fill="#b9ccf3"/><circle cx="80" cy="49" r="4" fill="#b9ccf3"/>
    </g>
  </g>
  <g font-family="Inter, Arial, Tahoma, sans-serif">
    <text x="64" y="62" fill="#91a6c8" font-size="14" letter-spacing="3" font-weight="700">LEARN · BUILD · GROW</text>
    <text x="66" y="126" fill="#f7faff" font-size="43" font-weight="800">Git <tspan fill="#ff5a43">Handbook</tspan></text>
    <text x="68" y="165" fill="#c9d7ec" font-size="22">From Zero to Advanced</text>
    <text x="68" y="197" fill="#91a7c7" font-size="15">A practical guide for developers of all levels.</text>
    <text x="1136" y="62" text-anchor="end" fill="#91a6c8" font-size="14" letter-spacing="2" font-weight="700">یاد بگیر · بساز · رشد کن</text>
    <text x="1136" y="126" text-anchor="end" direction="rtl" unicode-bidi="plaintext" fill="#f7faff" font-size="43" font-weight="800">راهنمای <tspan fill="#ff5a43">Git</tspan></text>
    <text x="1136" y="165" text-anchor="end" direction="rtl" unicode-bidi="plaintext" fill="#c9d7ec" font-size="22">از صفر تا حرفه‌ای</text>
    <text x="1136" y="197" text-anchor="end" direction="rtl" unicode-bidi="plaintext" fill="#91a7c7" font-size="15">یک مرجع کاربردی برای یادگیری Git</text>
  </g>
  <g font-family="Inter, Arial, Tahoma, sans-serif" font-size="14" text-anchor="middle">
    <g transform="translate(100 345)">
      <rect x="-27" y="-20" width="54" height="42" rx="12" fill="#1558a6" fill-opacity=".55" stroke="#307fdc" stroke-opacity=".8"/>
      <path d="M-15 -5 L-2 -11 L11 -5 L11 10 L-2 4 L-15 10 Z" fill="none" stroke="#dceeff" stroke-width="2"/>
      <text y="44" fill="#e2eaff">Clear explanations</text>
    </g>
    <g transform="translate(250 345)">
      <rect x="-27" y="-20" width="54" height="42" rx="12" fill="#087e78" fill-opacity=".48" stroke="#0bc5b4" stroke-opacity=".7"/>
      <path d="M-14 -7 L-21 0 L-14 7 M14 -7 L21 0 L14 7 M4 -11 L-4 11" fill="none" stroke="#7df7df" stroke-width="2.5"/>
      <text y="44" fill="#e2eaff">Practical examples</text>
    </g>
    <g transform="translate(950 345)">
      <rect x="-27" y="-20" width="54" height="42" rx="12" fill="#7c2daa" fill-opacity=".42" stroke="#ac6bff" stroke-opacity=".8"/>
      <circle r="12" fill="none" stroke="#ead9ff" stroke-width="2"/><path d="M0 -8 L0 0 L8 0" fill="none" stroke="#ead9ff" stroke-width="2"/>
      <text y="44" fill="#e2eaff" direction="rtl">گردش‌کارهای واقعی</text>
    </g>
    <g transform="translate(1100 345)">
      <rect x="-27" y="-20" width="54" height="42" rx="12" fill="#a5422d" fill-opacity=".4" stroke="#ff805b" stroke-opacity=".85"/>
      <path d="M-12 6 L7 -11 L13 -8 L-4 11 L-10 12 Z" fill="#ff805b"/><circle cx="-2" cy="3" r="3" fill="#14203b"/>
      <text y="44" fill="#e2eaff" direction="rtl">مناسب مبتدی تا حرفه‌ای</text>
    </g>
  </g>
  <path d="M64 399 H1136" stroke="#537097" stroke-opacity=".45"/>
  <text x="600" y="411" text-anchor="middle" fill="#91a7c7" font-family="Inter,Arial,Tahoma,sans-serif" font-size="12" letter-spacing="2">BETTER COMMITS · CLEARER WORKFLOWS · STRONGER FOUNDATIONS</text>
</svg>